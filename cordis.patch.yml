# Bundle patch for the dino-dashboard plugin: one Host row that serves the
# read-only snapshot route, plus its Client half (declared in package.json's
# dsh.client) which renders the sidebar entry and the dashboard panel.
#
# Project-specific values belong in the user's profile patch, not here.
- insert:
    - id: dino-dashboard
      name: '@local/dino-dashboard'
      config:
        # Workspace to scan. Empty uses the DSH default working directory.
        localRoot: ''
        # dsh-ssh host alias for remote data; empty disables remote scans.
        remoteAlias: ''
        # Remote roots inside that host, e.g. /data/raw, /data/runs, /data/logs.
        remoteRoots:
          downloadRoot: ''
          trainingRoot: ''
          logRoot: ''
          benchRoot: ''
        # Optional Markdown task plan, relative to localRoot. Empty = no tasks.
        taskPlan: ''
        # Optional known total sizes (bytes) for download percent/ETA.
        downloadTotals: {}
        # Optional per-task evidence rules, e.g. T1: { doneWhen: [...] }.
        taskRules: {}
        # Optional low-token AI task classification through the Host llm service.
        aiTasks:
          enabled: false
          intervalSeconds: 600
          maxTokens: 500
          reasoningEffort: off
          provider: ''
          model: ''
        # Seconds before the cached snapshot is rebuilt (2 = near real-time).
        refreshSeconds: 2
